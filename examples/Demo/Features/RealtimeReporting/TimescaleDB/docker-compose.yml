services:

    timescaledb:
        image: timescale/timescaledb:2.25.0-pg18-oss
        command: postgres -c 'max_connections=500'
        restart: always
        ports:
            - "5432:5432"
        volumes:
            - nb_studio_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: nb_studio_db
            POSTGRES_USER: nb_studio_db
            POSTGRES_PASSWORD: nb_studio_db
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -d 'user=nb_studio_db dbname=nb_studio_db'" ]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 5s

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5051:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin

volumes:
    metrics-data:
        driver: local

    pgadmin-data:
        driver: local
