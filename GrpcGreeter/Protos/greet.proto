syntax = "proto3";

option csharp_namespace = "GrpcGreeter";

package greet;

// The greeting service definition.
service Greeter {
  rpc SendData (SendDataRequest) returns (SendDataReply);
  rpc ReadData (ReadDataRequest) returns (ReadDataReply);
}

// Requests
message SendDataRequest {
  int32 recordId = 1;
  bytes data = 2;
}

message ReadDataRequest {
  int32 recordId = 1;
}

// Replies
message SendDataReply {
  string sendDataStatus = 1;
}

message ReadDataReply {
  bytes data = 1;
}
